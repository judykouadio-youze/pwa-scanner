<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Scanner – Superviseur</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .container {
      background: white;
      padding: 20px;
      border-radius: 15px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.1);
      text-align: center;
      width: 350px;
    }
    h2 {
      margin-bottom: 20px;
    }
    input {
      width: 100%;
      padding: 10px;
      margin: 8px 0;
      border-radius: 8px;
      border: 1px solid #ccc;
    }
    button {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
      background: #007bff;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
    button:hover {
      background: #0056b3;
    }
    .log {
      background: #000;
      color: #0f0;
      font-family: monospace;
      height: 150px;
      overflow-y: auto;
      text-align: left;
      padding: 8px;
      margin-top: 10px;
      border-radius: 10px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>🔐 Scanner – Superviseur</h2>

    <!-- 🟢 Ton lien Apps Script ici -->
    <input id="exec" placeholder="URL Web App /exec" value="https://script.google.com/macros/s/AKfycbxQoYaj-26s0z1a_PeuZFM9-v5S1OX60U0rp4zik9HnmVxxNlq5I_COIYTAS_PSJ-K0eQ/exec">

    <!-- 🟢 Ton token superviseur -->
    <input id="token" placeholder="Token superviseur" value="SUP-TEAG-SOP097">

    <button onclick="verifier()">VÉRIFIER & DÉMARRER</button>
    <div id="log" class="log"></div>
    <div id="reader" style="margin-top:10px;"></div>
  </div>

  <script>
    function log(msg) {
      const logBox = document.getElementById('log');
      logBox.innerHTML += msg + "<br>";
      logBox.scrollTop = logBox.scrollHeight;
    }

    async function verifier() {
      const execUrl = document.getElementById('exec').value.trim();
      const token = document.getElementById('token').value.trim();
      log("Vérification du token...");

      try {
        const res = await fetch(`${execUrl}?check=token&token=${encodeURIComponent(token)}`);
        const text = await res.text();
        if (text.includes("OK")) {
          log("✅ Token validé. Ouverture caméra...");
          demarrerScan(execUrl, token);
        } else {
          log("❌ Token invalide : " + text);
        }
      } catch (err) {
        log("⚠️ Erreur de connexion : " + err.message);
      }
    }

    function demarrerScan(execUrl, token) {
      const html5QrCode = new Html5Qrcode("reader");
      Html5Qrcode.getCameras().then(cameras => {
        if (cameras && cameras.length) {
          html5QrCode.start(
            cameras[0].id,
            { fps: 10, qrbox: 250 },
            qrCodeMessage => {
              log("📸 QR détecté : " + qrCodeMessage);
              fetch(`${execUrl}?token=${encodeURIComponent(token)}&data=${encodeURIComponent(qrCodeMessage)}`)
                .then(r => r.text())
                .then(t => log("✅ " + t))
                .catch(e => log("⚠️ Erreur d’envoi : " + e.message));
            },
            err => {}
          );
        } else {
          log("⚠️ Aucune caméra détectée.");
        }
      }).catch(err => log("⚠️ Erreur caméra : " + err.message));
    }
  </script>
</body>
</html>
