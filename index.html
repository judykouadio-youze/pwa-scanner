<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Scanner – Superviseur</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <script src="https://unpkg.com/html5-qrcode/minified/html5-qrcode.min.js"></script>

  <style>
    body {
      font-family: "Segoe UI", sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: linear-gradient(135deg, #0a58ca, #1e90ff);
      margin: 0;
    }
    .container {
      background: white;
      padding: 25px;
      border-radius: 20px;
      width: 90%;
      max-width: 400px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
    }
    h1 {
      color: #003366;
      font-size: 1.5rem;
      margin-bottom: 15px;
    }
    input, select, button {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 1rem;
    }
    input[readonly] {
      background-color: #f3f3f3;
      color: #888;
    }
    button {
      background: #007bff;
      color: white;
      border: none;
      cursor: pointer;
      transition: background 0.3s;
    }
    button:hover {
      background: #0056b3;
    }
    #log {
      background: black;
      color: #00ff00;
      padding: 10px;
      border-radius: 8px;
      margin-top: 15px;
      height: 130px;
      overflow-y: auto;
      text-align: left;
      font-family: monospace;
      font-size: 0.85rem;
    }
    #reader {
      width: 100%;
      margin-top: 10px;
    }
    img.logo {
      width: 150px;
      margin-bottom: 10px;
    }
  </style>
</head>

<body>
  <div class="container">
    <img src="https://i.imgur.com/2NYN8Wr.png" alt="Logo" class="logo" />
    <h1>🔒 Scanner – Superviseur</h1>

    <!-- Champ lien figé -->
    <input id="exec" readonly value="https://script.google.com/macros/s/AKfycbxVINVZqAay6-pRlrUHYcyCuTNb6ieqJp154nVb5ylxF3wS7BK8zenKATZ3wSZRow/exec">

    <!-- Champ token superviseur -->
    <input id="token" placeholder="Entrez votre token superviseur">

    <button id="btnStart">Se connecter</button>

    <div id="log"></div>
    <div id="reader"></div>
  </div>

  <script>
    const logDiv = document.getElementById("log");
    function log(msg) {
      logDiv.innerHTML += msg + "<br>";
      logDiv.scrollTop = logDiv.scrollHeight;
    }

    let html5QrCode;
    let cameraId = null;

    // 🔹 Fonction principale : démarrer le scanner
    async function startScanner(execUrl, token) {
      log("🔍 Vérification du token...");
      try {
        const test = await fetch(`${execUrl}?token=${token}`);
        const text = await test.text();
        if (!text.includes("Employé") && !text.includes("✅")) {
          log("❌ Token invalide ou refusé.");
          return;
        }
      } catch {
        log("⚠️ Impossible de vérifier le token.");
        return;
      }

      log("✅ Token validé. Ouverture de la caméra...");

      if (!html5QrCode) html5QrCode = new Html5Qrcode("reader");

      const cameras = await Html5Qrcode.getCameras();
      if (cameras && cameras.length) {
        // Utiliser la caméra arrière si disponible
        const backCam = cameras.find(cam => cam.label.toLowerCase().includes("back")) || cameras[0];
        cameraId = backCam.id;
      } else {
        log("❌ Aucune caméra détectée.");
        return;
      }

      await html5QrCode.start(
        cameraId,
        { fps: 10, qrbox: 250 },
        (decodedText) => {
          log("📸 QR détecté : " + decodedText);
          let matricule = decodedText;
          try {
            const u = new URL(decodedText);
            const m = u.searchParams.get("matricule");
            if (m) matricule = m;
          } catch {}
          
          fetch(`${execUrl}?token=${encodeURIComponent(token)}&matricule=${encodeURIComponent(matricule)}`)
            .then(res => res.text())
            .then(txt => log("✅ " + txt))
            .catch(err => log("⚠️ Erreur d’envoi : " + err.message));
        },
        (error) => {}
      );
    }

    // 🔹 Bouton "Se connecter"
    document.getElementById("btnStart").addEventListener("click", () => {
      const execUrl = document.getElementById("exec").value.trim();
      const token = document.getElementById("token").value.trim();

      if (!execUrl || !token) {
        log("⚠️ Veuillez entrer un token valide.");
        return;
      }
      startScanner(execUrl, token);
    });
  </script>
</body>
</html>
