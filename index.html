<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Superviseur – QR Scanner</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="logo.png" />
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    body {
      font-family: "Segoe UI", sans-serif;
      background: linear-gradient(135deg, #0056b3, #007bff);
      color: #333;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .container {
      background: white;
      padding: 20px;
      border-radius: 15px;
      box-shadow: 0 5px 25px rgba(0,0,0,0.2);
      text-align: center;
      width: 360px;
    }
    .logo {
      width: 80px;
      margin-bottom: 10px;
    }
    h2 {
      color: #0056b3;
    }
    input {
      width: 100%;
      padding: 10px;
      margin: 8px 0;
      border-radius: 8px;
      border: 1px solid #ccc;
    }
    button {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
      background: #007bff;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 15px;
      font-weight: bold;
    }
    button:hover {
      background: #0056b3;
    }
    .log {
      background: #000;
      color: #0f0;
      font-family: monospace;
      height: 150px;
      overflow-y: auto;
      text-align: left;
      padding: 8px;
      margin-top: 10px;
      border-radius: 10px;
    }
    select {
      margin-top: 10px;
      width: 100%;
      padding: 8px;
      border-radius: 6px;
    }
  </style>
</head>
<body>
  <div class="container">
    <img src="logo.png" alt="Logo" class="logo">
    <h2>🔐 Scanner – Superviseur</h2>

    <!-- 🟢 Ton lien Apps Script ici -->
    <input id="exec" placeholder="URL Web App /exec" value="https://script.google.com/macros/s/AKfycbxQoYaj-26s0z1a_PeuZFM9-v5S1OX60U0rp4zik9HnmVxxNlq5I_COIYTAS_PSJ-K0eQ/exec">

    <!-- 🟢 Ton token superviseur -->
    <input id="token" placeholder="Token superviseur" value="SUP-TEAG-SOP097">

    <button onclick="verifier()">VÉRIFIER & DÉMARRER</button>
    <select id="cameraSelect"></select>
    <div id="log" class="log"></div>
    <div id="reader" style="margin-top:10px;"></div>
  </div>

  <script>
    let html5QrCode;
    let currentCameraId = null;

    function log(msg) {
      const logBox = document.getElementById('log');
      logBox.innerHTML += msg + "<br>";
      logBox.scrollTop = logBox.scrollHeight;
    }

    async function verifier() {
      const execUrl = document.getElementById('exec').value.trim();
      const token = document.getElementById('token').value.trim();
      log("Vérification du token...");

      try {
        const res = await fetch(`${execUrl}?check=token&token=${encodeURIComponent(token)}`);
        const text = await res.text();
        if (text.includes("OK")) {
          log("✅ Token validé. Ouverture caméra...");
          initCameras(execUrl, token);
        } else {
          log("❌ Token invalide : " + text);
        }
      } catch (err) {
        log("⚠️ Erreur de connexion : " + err.message);
      }
    }

    function initCameras(execUrl, token) {
      Html5Qrcode.getCameras().then(devices => {
        const cameraSelect = document.getElementById("cameraSelect");
        cameraSelect.innerHTML = "";
        devices.forEach((d, i) => {
          const opt = document.createElement("option");
          opt.value = d.id;
          opt.text = d.label || `Caméra ${i + 1}`;
          cameraSelect.appendChild(opt);
        });

        if (devices.length > 1) {
          const backCamera = devices.find(d => d.label.toLowerCase().includes("back")) || devices[1];
          currentCameraId = backCamera.id;
        } else {
          currentCameraId = devices[0].id;
        }

        cameraSelect.value = currentCameraId;
        cameraSelect.addEventListener("change", e => {
          currentCameraId = e.target.value;
          startScanner(execUrl, token);
        });

        startScanner(execUrl, token);
      }).catch(err => log("⚠️ Erreur d’accès à la caméra : " + err.message));
    }

    function startScanner(execUrl, token) {
      if (html5QrCode) html5QrCode.stop();
      html5QrCode = new Html5Qrcode("reader");

      html5QrCode.start(
        currentCameraId,
        { fps: 10, qrbox: 250 },
        qrCodeMessage => {
          log("📸 QR détecté : " + qrCodeMessage);
          fetch(`${execUrl}?token=${encodeURIComponent(token)}&data=${encodeURIComponent(qrCodeMessage)}`)
            .then(r => r.text())
            .then(t => log("✅ " + t))
            .catch(e => log("⚠️ Erreur d’envoi : " + e.message));
        },
        err => {}
      );
    }
  </script>
</body>
</html>
