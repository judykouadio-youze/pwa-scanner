<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Scanner – Superviseur</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <script src="https://unpkg.com/html5-qrcode/minified/html5-qrcode.min.js"></script>
  <style>
    body {
      font-family: "Segoe UI", sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: linear-gradient(135deg, #0052cc, #007bff);
      margin: 0;
    }
    .container {
      background: white;
      padding: 25px;
      border-radius: 20px;
      width: 90%;
      max-width: 400px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
    }
    h1 {
      color: #003366;
      font-size: 1.4rem;
      margin-bottom: 10px;
    }
    #welcome {
      font-weight: bold;
      color: #007bff;
      margin-bottom: 10px;
    }
    input, button {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 1rem;
    }
    input[readonly] {
      background-color: #f3f3f3;
      color: #888;
    }
    button {
      background: #007bff;
      color: white;
      border: none;
      cursor: pointer;
      transition: background 0.3s;
    }
    button:hover { background: #0056b3; }
    #log {
      background: black;
      color: #00ff00;
      padding: 10px;
      border-radius: 8px;
      margin-top: 15px;
      height: 140px;
      overflow-y: auto;
      text-align: left;
      font-family: monospace;
      font-size: 0.85rem;
    }
    #reader { width: 100%; margin-top: 10px; }
    img.logo { width: 140px; margin-bottom: 10px; }
  </style>
</head>
<body>
  <div class="container">
    <img src="https://i.imgur.com/2NYN8Wr.png" alt="Logo SOPREMI" class="logo" />
    <h1>🔒 Scanner – Superviseur</h1>
    <div id="welcome"></div>

    <!-- Champ URL WebApp (non modifiable) -->
    <input id="exec" readonly 
      value="https://script.google.com/macros/s/AKfycbxVlNVZqAay6-pRrUHYcyCuTNb6ieqJp154nVb5ylxF3wS7BK8zenKATZ3wSZRduHBY-w/exec/exec">

    <!-- Champ token superviseur -->
    <input id="token" placeholder="Entrez votre token superviseur">

    <!-- Bouton de connexion -->
    <button id="btnLogin">Se connecter</button>

    <!-- Zone de log -->
    <div id="log"></div>

    <!-- Zone vidéo QR -->
    <div id="reader"></div>
  </div>

  <script>
    const logDiv = document.getElementById("log");
    const welcomeDiv = document.getElementById("welcome");
    let html5QrCode;
    let currentSupervisor = "";

    // Affichage dans la console visuelle
    function log(msg) {
      logDiv.innerHTML += msg + "<br>";
      logDiv.scrollTop = logDiv.scrollHeight;
    }

    // Fonction principale pour démarrer le scanner
    async function startScanner(execUrl) {
      const cameras = await Html5Qrcode.getCameras();
      if (!cameras.length) {
        log("❌ Aucune caméra détectée.");
        return;
      }

      // Sélection automatique de la caméra arrière si disponible
      const cam = cameras.find(c => c.label.toLowerCase().includes("back")) || cameras[0];
      if (!html5QrCode) html5QrCode = new Html5Qrcode("reader");

      await html5QrCode.start(
        cam.id,
        { fps: 10, qrbox: 250 },
        (decodedText) => {
          log("📸 QR détecté : " + decodedText);
          let matricule = decodedText;

          try {
            const url = new URL(decodedText);
            const m = url.searchParams.get("matricule");
            if (m) matricule = m;
          } catch {}

          // Envoi du scan à Google Apps Script
          fetch(`${execUrl}?matricule=${encodeURIComponent(matricule)}&superviseur=${encodeURIComponent(currentSupervisor)}`)
            .then(res => res.text())
            .then(txt => log(txt))
            .catch(err => log("⚠️ Erreur d’envoi : " + err.message));
        },
        (err) => {}
      );
    }

    // Bouton de connexion superviseur
    document.getElementById("btnLogin").addEventListener("click", async () => {
      const execUrl = document.getElementById("exec").value;
      const token = document.getElementById("token").value.trim();

      if (!token) {
        log("⚠️ Veuillez entrer votre token superviseur.");
        return;
      }

      log("🔍 Vérification du token...");
      try {
        const res = await fetch(`${execUrl}?token=${encodeURIComponent(token)}`);
        const data = await res.json();
        if (data.ok) {
          currentSupervisor = data.superviseur;
          welcomeDiv.innerHTML = `👋 Bonjour <span style="color:#003366;">${data.superviseur}</span>, vous pouvez commencer le scan.`;
          log("✅ Token validé, ouverture de la caméra...");
          startScanner(execUrl);
        } else {
          log("❌ " + data.message);
        }
      } catch (err) {
        log("⚠️ Erreur de vérification : " + err.message);
      }
    });
  </script>
</body>
</html>
