<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Scanner – Superviseur SOPREMI</title>

  <!-- Html5-qrcode (bibliothèque) -->
  <script src="https://unpkg.com/html5-qrcode/minified/html5-qrcode.min.js"></script>

  <style>
    :root{--blue:#007bff;--dark:#003366}
    body{font-family:Inter,Segoe UI,Arial,sans-serif;background:linear-gradient(135deg,#004aad,#007bff);margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center}
    .card{background:#fff;border-radius:18px;padding:22px;width:92%;max-width:420px;box-shadow:0 10px 30px rgba(0,0,0,.18);text-align:center}
    .logo{width:140px;margin:0 auto 10px;display:block}
    h1{color:var(--dark);margin:4px 0 8px;font-size:1.4rem}
    #welcome{color:var(--blue);font-weight:700;margin-bottom:10px}
    input,button,select{width:100%;padding:12px;border-radius:8px;border:1px solid #d0d7de;font-size:1rem;margin-top:10px;box-sizing:border-box}
    input[readonly]{background:#f2f6fb;color:#666}
    button{background:var(--blue);color:#fff;border:none;cursor:pointer}
    button:hover{filter:brightness(.95)}
    #log{background:#000;color:#0f0;padding:10px;border-radius:8px;margin-top:14px;height:140px;overflow:auto;text-align:left;font-family:monospace;font-size:.9rem}
    #reader{margin-top:12px}
    .success{color:#00cc66}
    .error{color:#ff5555}
    .controls{display:flex;gap:8px;margin-top:10px}
    .controls button{flex:1}
    .muted{color:#666;font-size:.9rem;margin-top:6px}
  </style>
</head>
<body>
  <div class="card">
    <!-- logo hébergé dans ton repo GitHub (raw) -->
    <img class="logo" alt="Logo SOPREMI" src="https://raw.githubusercontent.com/judykouadio-youze/pwa-scanner/main/logo.png">

    <h1>🔒 Scanner – Superviseur</h1>
    <div id="welcome">Entrez votre token pour démarrer</div>

    <!-- lien exec (figé, non modifiable) -->
    <input id="exec" readonly
      value="https://script.google.com/macros/s/AKfycbxVlNVZqAay6-pRrUHYcyCuTNb6ieqJp154nVb5ylxF3wS7BK8zenKATZ3wSZRduHBY-w/exec">

    <!-- token du superviseur (sera enregistré localement si coché) -->
    <input id="token" placeholder="Token superviseur (ex: SUP-TEAG-SOP097)">

    <div class="controls">
      <button id="btnLogin">Se connecter</button>
      <button id="btnClear" title="Changer de superviseur">Changer</button>
    </div>

    <div id="log" aria-live="polite"></div>

    <!-- zone vidéo pour html5-qrcode -->
    <div id="reader"></div>
    <div class="muted">Astuce : utilisez la caméra arrière. Si la PWA est installée, installez-la pour un accès rapide.</div>
  </div>

  <script>
    (function () {
      const execInput = document.getElementById('exec');
      const tokenInput = document.getElementById('token');
      const loginBtn = document.getElementById('btnLogin');
      const clearBtn = document.getElementById('btnClear');
      const logDiv = document.getElementById('log');
      const welcome = document.getElementById('welcome');
      const readerDiv = document.getElementById('reader');

      const EXEC_URL = execInput.value.trim();
      let html5QrCode = null;
      let currentSupervisor = '';
      // petite protection locale anti double envoi (par matricule) : 3s
      const lastLocalScan = {};
      const LOCAL_COOLDOWN_SEC = 3;

      // restore token if saved
      if (localStorage.getItem('sup_token')) {
        tokenInput.value = localStorage.getItem('sup_token');
      }

      function log(msg, cls) {
        const span = document.createElement('div');
        span.innerHTML = msg;
        if (cls) span.className = cls;
        logDiv.appendChild(span);
        logDiv.scrollTop = logDiv.scrollHeight;
      }

      function clearLog() { logDiv.innerHTML = ''; }

      // parse server reply: prefer JSON, fallback text
      async function fetchJsonOrText(url) {
        const res = await fetch(url);
        const text = await res.text();
        try { return { parsed: JSON.parse(text), raw: text }; }
        catch(e) { return { parsed: null, raw: text }; }
      }

      // start scanner, choose back camera when possible
      async function startScanner() {
        try {
          if (!window.Html5Qrcode) {
            log('❌ Bibliothèque html5-qrcode non chargée', 'error');
            return;
          }
          const devices = await Html5Qrcode.getCameras();
          if (!devices || devices.length === 0) {
            log('❌ Aucune caméra trouvée', 'error');
            return;
          }

          // prefer back camera
          let chosen = devices[0];
          for (const d of devices) {
            if (d.label && d.label.toLowerCase().includes('back')) { chosen = d; break; }
            if (d.label && d.label.toLowerCase().includes('rear')) { chosen = d; break; }
          }

          if (!html5QrCode) html5QrCode = new Html5Qrcode(/* element id */ "reader", { qrbox: 250 });

          await html5QrCode.start(
            chosen.id,
            { fps: 10, qrbox: 250 },
            async (decodedText, result) => {
              // decodedText may be full URL with params OR just matricule
              log('📸 QR détecté : ' + decodedText);
              let matricule = decodedText;
              try {
                const u = new URL(decodedText);
                const m = u.searchParams.get('matricule');
                if (m) matricule = m;
              } catch(e) { /* not a URL, leave matricule */ }

              const now = Date.now();
              const last = lastLocalScan[matricule] || 0;
              if ((now - last) / 1000 < LOCAL_COOLDOWN_SEC) {
                log('⚠️ Scan ignoré (cooldown local)', 'error');
                return;
              }
              lastLocalScan[matricule] = now;

              // call Apps Script
              const url = `${EXEC_URL}?matricule=${encodeURIComponent(matricule)}&superviseur=${encodeURIComponent(currentSupervisor)}`;
              try {
                const { parsed, raw } = await fetchJsonOrText(url);
                if (parsed) {
                  if (parsed.ok) {
                    log(parsed.message || JSON.stringify(parsed), 'success');
                  } else {
                    log(parsed.message || JSON.stringify(parsed), 'error');
                  }
                } else {
                  // raw text fallback
                  log(raw, raw.includes('✅') ? 'success' : 'error');
                }
              } catch (err) {
                log('⚠️ Erreur d\'envoi : ' + (err.message || err), 'error');
              }
            },
            (errorMessage) => {
              // ignore momentary errors (noisy)
            }
          );
        } catch (err) {
          log('⚠️ Impossible de démarrer la caméra : ' + err.message, 'error');
        }
      }

      // stop scanner gracefully
      async function stopScanner() {
        if (html5QrCode) {
          try {
            await html5QrCode.stop();
            html5QrCode.clear();
            html5QrCode = null;
            readerDiv.innerHTML = '';
            log('🛑 Scanner arrêté');
          } catch(e) {
            // ignore
          }
        }
      }

      // login workflow: verify token with server
      loginBtn.addEventListener('click', async () => {
        clearLog();
        const token = tokenInput.value.trim();
        if (!token) { log('⚠️ Entrez un token valide', 'error'); return; }

        log('🔍 Vérification du token...');
        try {
          // call the exec with token only; server returns JSON {ok:true, superviseur:"Nom ..."}
          const res = await fetchJsonOrText(`${EXEC_URL}?token=${encodeURIComponent(token)}`);
          const parsed = res.parsed;
          if (parsed) {
            if (parsed.ok) {
              currentSupervisor = parsed.superviseur || token;
              welcome.innerHTML = `👋 Bonjour <strong style="color:var(--dark)">${currentSupervisor}</strong>, vous pouvez commencer le scan.`;
              localStorage.setItem('sup_token', token);
              log('✅ Token validé, ouverture de la caméra...', 'success');
              await startScanner();
            } else {
              log('❌ ' + (parsed.message || 'Token invalide'), 'error');
            }
          } else {
            // fallback if server returned plain text
            const raw = res.raw || '';
            log('⚠️ Réponse serveur (non-JSON): ' + raw, 'error');
          }
        } catch (err) {
          log('⚠️ Erreur de vérification : ' + (err.message || err), 'error');
        }
      });

      // change supervisor : clear token and stop scanner
      clearBtn.addEventListener('click', async () => {
        await stopScanner();
        currentSupervisor = '';
        tokenInput.value = '';
        localStorage.removeItem('sup_token');
        welcome.innerHTML = 'Entrez votre token pour démarrer';
        clearLog();
      });

      // On leave page -> stop camera
      window.addEventListener('beforeunload', async () => {
        try { await stopScanner(); } catch(e){}
      });

      // Small UX: if there is a saved token, try auto login attempt (but do not start camera without user click)
      // We pre-validate the token so user only needs to click "Se connecter" to start camera.
      (async function prevalidateSavedToken(){
        const saved = localStorage.getItem('sup_token');
        if (!saved) return;
        try {
          const res = await fetchJsonOrText(`${EXEC_URL}?token=${encodeURIComponent(saved)}`);
          const parsed = res.parsed;
          if (parsed && parsed.ok) {
            tokenInput.value = saved;
            welcome.innerHTML = `👋 Bonjour <strong style="color:var(--dark)">${parsed.superviseur}</strong> — cliquez "Se connecter" pour lancer la caméra.`;
            log('✅ Token trouvé en local (pré-validé).', 'success');
          } else {
            log('⚠️ Token local invalide — connectez-vous.', 'error');
          }
        } catch(e){
          log('⚠️ Prévalidation token impossible : ' + e.message, 'error');
        }
      })();

    })();
  </script>
</body>
</html>
