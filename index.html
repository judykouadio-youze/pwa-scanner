<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Scanner – SOPREMI</title>

<!-- DESIGN -->
<style>
    body {
        margin: 0;
        background: linear-gradient(135deg, #0052A5, #007BFF);
        font-family: Arial, sans-serif;
        color: white;
        text-align: center;
    }
    .box {
        margin: 40px auto;
        background: white;
        color: black;
        max-width: 420px;
        padding: 20px;
        border-radius: 18px;
        box-shadow: 0 4px 25px rgba(0,0,0,0.25);
    }
    img.logo {
        width: 200px;
        margin-bottom: 10px;
    }
    input, button, select {
        width: 92%;
        padding: 12px;
        margin-top: 10px;
        border-radius: 8px;
        border: 1px solid #ccc;
        font-size: 16px;
    }
    button {
        background: #007BFF;
        color: white;
        font-weight: bold;
        cursor: pointer;
        border: none;
    }
    button:hover { background: #005FDB; }

    #console {
        margin-top: 10px;
        background: black;
        color: #00FF00;
        text-align: left;
        padding: 12px;
        height: 160px;
        overflow-y: auto;
        border-radius: 8px;
        font-family: "Courier New", monospace;
        font-size: 14px;
    }
</style>

<!-- HTML5 QR CODE LIBRARY -->
<script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

</head>
<body>

<div class="box">

    <!-- TON LOGO (déjà dans GitHub) -->
    <img src="logo.png" class="logo" />

    <h2>🔒 Scanner – Superviseur</h2>
    <p>Entrez votre token pour démarrer</p>

    <!-- URL FIXE -->
    <input id="execUrl" value="https://script.google.com/macros/s/AKfycby9FgvP9BpAh2OU8I7gN6OtmmHgxgalo7tQLzRw7XkqxjCMQ7aSoEzUJz5gIJjUxNdx/exec" readonly />

    <!-- TOKEN -->
    <input id="token" placeholder="Votre token superviseur" />

    <button onclick="connect()">Se connecter</button>
    <button onclick="location.reload()">Changer</button>

    <div id="console">Console prête...</div>

    <div id="reader" style="margin-top:15px;"></div>

</div>

<script>
let superviseur = null;

// ÉCRIT DANS LA CONSOLE
function log(msg) {
    document.getElementById("console").innerHTML += "<div>" + msg + "</div>";
}

// BOUTON SE CONNECTER
async function connect() {
    log("🔍 Vérification du token...");

    const url = document.getElementById("execUrl").value;
    const token = document.getElementById("token").value.trim();

    if (!token) return log("⚠️ Token vide");

    try {
        const response = await fetch(url + "?token=" + token);
        const data = await response.json();

        if (!data.ok) return log("❌ " + data.message);

        superviseur = data.superviseur;

        log("✅ Token validé : " + superviseur);
        startScanner();

    } catch (err) {
        log("❌ Erreur serveur : " + err);
    }
}

// DÉMARRER LE SCANNER
function startScanner() {
    log("📷 Ouverture de la caméra...");

    const html5Qr = new Html5Qrcode("reader");

    html5Qr.start(
        { facingMode: "environment" },  // caméra arrière
        { fps: 10, qrbox: { width: 250, height: 250 } },
        (qrText) => handleQR(qrText),
        () => {}
    );
}

// LECTURE DU QR CODE
async function handleQR(code) {
    log("📦 QR détecté : " + code);

    const url = document.getElementById("execUrl").value;

    try {
        const response = await fetch(url + code);
        const data = await response.json();

        if (!data.ok) return log("❌ " + data.message);

        log("✅ Enregistrement OK : " + data.employe.nom);

    } catch (err) {
        log("❌ Erreur d’envoi : " + err);
    }
}
</script>

</body>
</html>
