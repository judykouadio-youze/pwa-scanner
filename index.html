<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Superviseur – QR Scanner</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="logo.png" />
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    body {
      font-family: "Segoe UI", sans-serif;
      background: linear-gradient(135deg, #0056b3, #007bff);
      color: #333;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .container {
      background: white;
      padding: 20px;
      border-radius: 15px;
      box-shadow: 0 5px 25px rgba(0,0,0,0.2);
      text-align: center;
      width: 360px;
    }
    .logo {
      width: 80px;
      margin-bottom: 10px;
    }
    h2 {
      color: #0056b3;
    }
    input {
      width: 100%;
      padding: 10px;
      margin: 8px 0;
      border-radius: 8px;
      border: 1px solid #ccc;
    }
    input[readonly] {
      background: #f0f0f0;
      color: #777;
      cursor: not-allowed;
    }
    button {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
      background: #007bff;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 15px;
      font-weight: bold;
    }
    button:hover {
      background: #0056b3;
    }
    .log {
      background: #000;
      color: #0f0;
      font-family: monospace;
      height: 150px;
      overflow-y: auto;
      text-align: left;
      padding: 8px;
      margin-top: 10px;
      border-radius: 10px;
    }
    select {
      margin-top: 10px;
      width: 100%;
      padding: 8px;
      border-radius: 6px;
    }
    #scanner-section {
      display: none;
    }
    #welcome {
      color: #007bff;
      font-weight: bold;
      margin-bottom: 10px;
    }
  </style>
</head>
<body>
  <div class="container">
    <img src="logo.png" alt="Logo" class="logo">
    <h2>🔐 Scanner – Superviseur</h2>

    <!-- 🟢 Section connexion -->
    <div id="login-section">
      <input id="exec" placeholder="URL Web App /exec"
        value="https://script.google.com/macros/s/AKfycbxVlNVZqAay6-pRrUHYcyCuTNb6ieqJp154nVb5ylxF3wS7BK8zenKATZ3wSZRduHBY-w/exec"
        readonly>
      <input id="token" placeholder="Token superviseur">
      <button onclick="verifier()">Se connecter</button>
      <div id="login-log" class="log"></div>
    </div>

    <!-- 🟢 Section scanner -->
    <div id="scanner-section">
      <div id="welcome"></div>
      <select id="cameraSelect"></select>
      <button onclick="changerSuperviseur()">🔁 Changer de superviseur</button>
      <div id="log" class="log"></div>
      <div id="reader" style="margin-top:10px;"></div>
    </div>
  </div>

  <script>
    let html5QrCode;
    let currentCameraId = null;

    // 🟢 Liste des superviseurs et tokens
    const superviseurs = {
      "SUP-TEAG-SOP097": "TEA GONYATOU MARCEL",
      "HSE-GOUNT-SOP089": "GOUN TOKOUAHO DANIELLE",
      "HSE-TRAHAD-SOP096": "TRAHA DYANE MARILYSE"
    };

    function log(msg, target = "log") {
      const logBox = document.getElementById(target);
      logBox.innerHTML += msg + "<br>";
      logBox.scrollTop = logBox.scrollHeight;
    }

    async function verifier() {
      const execUrl = document.getElementById('exec').value.trim();
      const token = document.getElementById('token').value.trim();
      const loginLog = document.getElementById('login-log');
      loginLog.innerHTML = "🔍 Vérification du token...";

      try {
        const res = await fetch(`${execUrl}?check=token&token=${encodeURIComponent(token)}`);
        const text = await res.text();
        if (text.includes("OK")) {
          const nom = superviseurs[token] || "Superviseur inconnu";
          document.getElementById("welcome").innerHTML = `👋 Bonjour <strong>${nom}</strong>, vous pouvez commencer le scan.`;
          loginLog.innerHTML = "✅ Token validé. Préparation du scanner...";
          document.getElementById("login-section").style.display = "none";
          document.getElementById("scanner-section").style.display = "block";
          initCameras(execUrl, token);
        } else {
          loginLog.innerHTML = "❌ Token invalide.";
        }
      } catch (err) {
        loginLog.innerHTML = "⚠️ Erreur de connexion : " + err.message;
      }
    }

    function changerSuperviseur() {
      if (html5QrCode) html5QrCode.stop();
      document.getElementById("scanner-section").style.display = "none";
      document.getElementById("login-section").style.display = "block";
      document.getElementById("token").value = "";
      document.getElementById("login-log").innerHTML = "";
      document.getElementById("welcome").innerHTML = "";
    }

    function initCameras(execUrl, token) {
      Html5Qrcode.getCameras().then(devices => {
        const cameraSelect = document.getElementById("cameraSelect");
        cameraSelect.innerHTML = "";
        devices.forEach((d, i) => {
          const opt = document.createElement("option");
          opt.value = d.id;
          opt.text = d.label || `Caméra ${i + 1}`;
          cameraSelect.appendChild(opt);
        });

        if (devices.length > 1) {
          const backCamera = devices.find(d => d.label.toLowerCase().includes("back")) || devices[1];
          currentCameraId = backCamera.id;
        } else {
          currentCameraId = devices[0].id;
        }

        cameraSelect.value = currentCameraId;
        cameraSelect.addEventListener("change", e => {
          currentCameraId = e.target.value;
          startScanner(execUrl, token);
        });

        startScanner(execUrl, token);
      }).catch(err => log("⚠️ Erreur d’accès à la caméra : " + err.message));
    }

    function startScanner(execUrl, token) {
      if (html5QrCode) html5QrCode.stop();
      html5QrCode = new Html5Qrcode("reader");

      html5QrCode.start(
        currentCameraId,
        { fps: 10, qrbox: 250 },
        qrCodeMessage => {
          log("📸 QR détecté : " + qrCodeMessage);
          fetch(`${execUrl}?token=${encodeURIComponent(token)}&data=${encodeURIComponent(qrCodeMessage)}`)
            .then(r => r.text())
            .then(t => log("✅ " + t))
            .catch(e => log("⚠️ Erreur d’envoi : " + e.message));
        },
        err => {}
      );
    }
  </script>
</body>
</html>
